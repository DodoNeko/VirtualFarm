<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Virtual Farm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">

</head>

<body class="startImg user-select-none">
    <h1 id="leftTitle" class="titleLeftHeader user-select-none cursor-default">Virtual Farm</h1>
    <div class="startBtns d-flex flex-column"> 
        <button id="startBtn" class="startBtn">Create an account</button>
        <button id="continueBtn" class="continueBtn">Login</button>
    </div>
    <div id="loginPage" class="loginPage fade d-none">
        <div class="row justify-content-center">

            <div class="col-md-8">

                <h2 class="loginHeader header">
                    Login
                </h2>

                <div id="loginAlert" class="d-none alert alert-success">Data saved successfully</div>

                <form id="loginForm" class="d-flex flex-column justify-content-center">
                    
                    <div class="form-floating mb-3">
                        <input class="form-control mb-3" id="loginEmail" type="email" placeholder="Email">
                        <label for="email">Email</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input class="form-control mb-3" id="loginPassword" type="password" placeholder="Password">
                        <label for="password">Password</label>
                    </div>
                    <div class="mb-3 align-self-end">
                        <a href=""><i>Forgot password?</i></a>
                    </div>
                    
                    <button class="redBtn btn align-self-center mb-3 fs-4">
                        Confirm
                    </button>
                    <button id="openRegisterBtn" class="goldBtn btn align-self-center">
                        Create an account
                    </button>
                </form>

                <div id="message" class="mt-3 text-danger text-center">
                </div>

            </div>

        </div>

    </div>

    <div id="registerPage" class="loginPage fade d-none">
        <div class="row justify-content-center">

            <div class="col-md-8">

                <h2 class="loginHeader header">
                    Register
                </h2>
                <div id="registerAlert" class="d-none alert alert-success">Data saved successfully</div>

                <form id="registerForm" class="d-flex flex-column justify-content-center">

                    <div class="form-floating mb-3">
                        <input class="form-control mb-3" id="name" type="text" placeholder="Name">
                        <label for="name">Your name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input class="form-control mb-3" id="email" type="email" placeholder="Email">
                        <label for="email">Email</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input class="form-control mb-3" id="password" type="password" placeholder="Password">
                        <label for="password">Password</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input class="form-control mb-3" id="confirmPassword" type="password" placeholder="Confirm password">
                        <label for="confirmPassword">Confirm password</label>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="consents">
                        <label class="form-check-label" for="consents">
                            Consents
                    </div>

                    <button class="redBtn btn align-self-center mb-3 fs-4">
                        Register
                    </button>
                    <button id="openLoginBtn" class="goldBtn btn align-self-center">
                        Already have an account?
                    </button>
                </form>

                <div id="message" class="mt-3 text-danger text-center">
                </div>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>
</body>

</html>
