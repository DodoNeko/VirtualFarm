<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VF - Garden</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body class="gameBg user-select-none">
    <nav class="navBar">
        <div class="navLinks">
            <span id="gardenNav" class="navItem brownHeader">Garden</span>
            <span id="shopNav" class="navItem goldHeader">Shop</span>
            <span id="workNav" class="navItem goldHeader">Work</span>
            <span id="journalNav" class="navItem goldHeader">Journal</span>
        </div>
        <div class="d-flex align-items-center">
            <span id="logoutBtn" class="navItem logoutBtn">Logout</span>
        </div>
    </nav>

    <main class="page">
        <div class="row g-4 p-3 p-md-4">
            <!-- Lewa kolumna: Zarządzanie i tabela -->
            <div class="col-12 col-lg-7 d-flex flex-column">
                <div class="manageBox d-flex flex-column flex-grow-1">
                    <div
                        class="manageBoxActions d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <button id="addPlantBtn" data-bs-toggle="modal" data-bs-target="#addPlantModal"
                            class="goldBtn">New Plant</button>
                        <span class="brownHeader dayTitle">Day <span id="dayCounter">...</span></span>
                        <button id="nextDayBtn" class="redBtn">Next Day</button>
                    </div>

                    <div class="plantTableContainer flex-grow-1">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Biome</th>
                                    <th>Soil</th>
                                    <th>Phase</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="plantList">
                                <tr>
                                    <td>Lorem ipsum</td>
                                    <td>Lorem ipsum</td>
                                    <td>Lorem ipsum</td>
                                    <td>Lorem ipsum</td>
                                    <td>Lorem ipsum</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Prawa kolumna: Podgląd rośliny i statystyki -->
            <div class="col-12 col-lg-5 d-flex flex-column">
                <div class="plantBox flex-grow-1">
                    <div id="plantActions"></div>
                    <img id="plantPreview" src="../images/plants/dead.png" alt="Plant preview">
                </div>

                <div class="alert alert-warning plantStatsAlert mt-3 mb-0">
                    <p class="m-0">
                        <strong>Watered:</strong> <span id="wateredSpan">--</span>
                        <span class="mx-2 text-muted">|</span>
                        <strong>Cared:</strong> <span id="caredSpan">--</span>
                    </p>
                    <p class="m-0 mt-1">
                        <strong>Last watered:</strong> Day <span id="lastWateredSpan">--</span>
                        <span class="mx-2 text-muted">|</span>
                        <strong>Last cared:</strong> Day <span id="lastCaredSpan">--</span>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal dodawania rośliny -->
    <div class="modal fade" id="addPlantModal" tabindex="-1" role="dialog" aria-labelledby="plantModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div id="plantAlert" class="d-none alert alert-success m-3 mb-0">Data saved successfully</div>
                <form id="addPlantForm" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="plantModalLabel">Add plant to garden</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-floating mb-3">
                            <select class="form-select" id="seedSelect" aria-label="Seed">
                                <option value="" selected>--- Choose ---</option>
                            </select>
                            <label for="seedSelect">Seed</label>
                        </div>

                        <div class="form-floating mb-3">
                            <select class="form-select" id="soilSelect" aria-label="Soil">
                                <option value="" selected>--- Choose ---</option>
                                <option value="0">loam</option>
                                <option value="1">sandish</option>
                                <option value="2">rocky</option>
                                <option value="3">gravel</option>
                                <option value="4">ice</option>
                                <option value="5">dripstone</option>
                            </select>
                            <label for="soilSelect">Soil</label>
                        </div>

                        <div class="form-floating mb-3">
                            <select class="form-select" id="biomeSelect" aria-label="Biome">
                                <option value="" selected>--- Choose ---</option>
                                <option value="0">Forest</option>
                            </select>
                            <label for="biomeSelect">Biome</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input class="form-control" type="number" id="quantityInput" aria-label="Quantity" min="0"
                                value="0">
                            <label for="quantityInput">Quantity</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Plant seed</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/itemsDict.js"></script>
    <script src="../js/plantsDict.js"></script>
    <script src="../js/garden.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
